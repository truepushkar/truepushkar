name: Refresh activity cards

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:             # Actions tab -> Run workflow (do this once after the first push)
  push:
    paths:
      - scripts/render_activity.py
      - scripts/render_cards.py

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render activity cards
        env:
          # A PAT with read:user stored as PROFILE_TOKEN also counts private contributions.
          # Without it the built-in token is used (public contributions only).
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: truepushkar
          GH_ORGS: nullstacks
        run: python scripts/render_activity.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/activity-*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh activity cards" && git push)
