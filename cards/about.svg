<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 135" width="428" height="135" role="img" aria-label="profile.yaml: focus: Backend &amp; Web Development; stack: Python · Flask · Jinja; also: TypeScript · React · Workers; org: @nullstacks · since 2022; building: Small, sharp, composable tools"><title>profile.yaml: focus: Backend &amp; Web Development; stack: Python · Flask · Jinja; also: TypeScript · React · Workers; org: @nullstacks · since 2022; building: Small, sharp, composable tools</title><style>
:root{--bg:#fbfaf6;--card:#ffffff;--ink:#17171a;--mute:#6b6b73;--line:#d9d5c8;
--blue:#2f6fed;--red:#e5484d;--amber:#c98100;--teal:#12a37f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#12171e;--ink:#ecebe6;--mute:#8b949e;--line:#2b323d;
--blue:#6ea0ff;--red:#ff7b7f;--amber:#f5b942;--teal:#3ddbb0}}
path,rect,line{shape-rendering:crispEdges}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}.mute{fill:var(--mute)}
.ink{fill:var(--ink)}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) var(--d,0s) backwards}
.tick{opacity:0;animation:tick .13s linear var(--d,0s) both}
.final{animation:fade .3s ease-out var(--d,0s) backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s steps(2) infinite}
.twinkle{animation:twinkle 3s steps(1) var(--d,0s) infinite}
.march{animation:march 1s steps(2) infinite}
.flick{animation:flick .7s steps(1) var(--d,0s) backwards}
.title{animation:flick .7s steps(1) var(--d,0s) backwards,glint 6s linear var(--g,0s) infinite}
.orbit{opacity:.4;transform-box:fill-box;transform-origin:center;animation:orbit 3.6s linear var(--d,0s) infinite}
.zip{opacity:.4;transform-box:fill-box;transform-origin:center;animation:zip 4.2s linear var(--d,0s) infinite}
.wave{opacity:.35;animation:wave 3.2s linear var(--d,0s) infinite}
.sweep{transform-box:fill-box;transform-origin:center;animation:sweep 7s linear var(--d,0s) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes fade{from{opacity:0}}
@keyframes tick{0%,99%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes march{to{stroke-dashoffset:-8}}
@keyframes flick{0%{opacity:0}20%{opacity:1}35%{opacity:0}55%{opacity:1}70%{opacity:0}100%{opacity:1}}
@keyframes glint{0%{fill:var(--blue)}9%{fill:var(--ink)}100%{fill:var(--ink)}}
@keyframes orbit{0%{opacity:1;transform:scale(1.18)}22%{opacity:.4;transform:scale(1)}100%{opacity:.4}}
@keyframes zip{0%{opacity:1;transform:scale(1.3)}14%{opacity:.4;transform:scale(1)}100%{opacity:.4}}
@keyframes wave{0%{opacity:1}20%{opacity:.35}100%{opacity:.35}}
@keyframes sweep{0%{transform:scale(1.8)}3%{transform:scale(1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{opacity:0}.orbit,.zip,.wave{opacity:1}}
</style><path d="M8 4H424V8H428V131H424V135H8V131H4V8H8Z" style="fill:var(--blue);opacity:.28"/><path d="M5 1H419V5H423V126H419V130H5V126H1V5H5Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><rect x="16" y="10" width="7" height="7" fill="var(--red)"/><rect x="28" y="10" width="7" height="7" fill="var(--amber)"/><rect x="40" y="10" width="7" height="7" fill="var(--teal)"/><text class="mono mute" x="64" y="17" font-size="10" letter-spacing="1">profile.yaml</text><line x1="14" y1="24" x2="410" y2="24" stroke="var(--line)" stroke-width="2"/><g class="rise" style="--d:0.30s"><text class="mono" x="18" y="44" font-size="11.5" style="fill:var(--blue)">focus:</text><text class="mono" x="98" y="44" font-size="11.5">Backend &amp; Web Development</text></g><g class="rise" style="--d:0.42s"><text class="mono" x="18" y="61" font-size="11.5" style="fill:var(--blue)">stack:</text><text class="mono" x="98" y="61" font-size="11.5">Python · Flask · Jinja</text></g><g class="rise" style="--d:0.54s"><text class="mono" x="18" y="78" font-size="11.5" style="fill:var(--blue)">also:</text><text class="mono" x="98" y="78" font-size="11.5">TypeScript · React · Workers</text></g><g class="rise" style="--d:0.66s"><text class="mono" x="18" y="95" font-size="11.5" style="fill:var(--blue)">org:</text><text class="mono" x="98" y="95" font-size="11.5">@nullstacks · since 2022</text></g><g class="rise" style="--d:0.78s"><text class="mono" x="18" y="112" font-size="11.5" style="fill:var(--blue)">building:</text><text class="mono" x="98" y="112" font-size="11.5">Small, sharp, composable tools</text></g><rect class="blink" x="311" y="102" width="7" height="12" fill="var(--blue)"/></svg>