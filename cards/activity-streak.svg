text><path class="flick" style="--d:0.50s;fill:var(--amber)"  d="M582 18h4v4h-4zM586 18h4v4h-4zM590 18h4v4h-4zM594 18h4v4h-4zM578 22h4v4h-4zM582 22h4v4h-4zM594 22h4v4h-4zM598 22h4v4h-4zM578 26h4v4h-4zM582 26h4v4h-4zM594 26h4v4h-4zM598 26h4v4h-4zM582 30h4v4h-4zM586 30h4v4h-4zM590 30h4v4h-4zM594 30h4v4h-4zM598 30h4v4h-4zM594 34h4v4h-4zM598 34h4v4h-4zM590 38h4v4h-4zM594 38h4v4h-4zM582 42h4v4h-4zM586 42h4v4h-4zM590 42h4v4h-4z"/><text class="mono mute" x="578" y="68" font-size="9" letter-spacing="1">LONGEST · 1Y</text><g class="pulse"><path class="pop" style="--d:0.80s;fill:var(--red)" d="M415 52h3v3h-3zM412 55h3v3h-3zM415 55h3v3h-3zM409 58h3v3h-3zM412 58h3v3h-3zM415 58h3v3h-3zM421 58h3v3h-3zM409 61h3v3h-3zM412 61h3v3h-3zM415 61h3v3h-3zM418 61h3v3h-3zM421 61h3v3h-3zM406 64h3v3h-3zM409 64h3v3h-3zM412 64h3v3h-3zM415 64h3v3h-3zM418 64h3v3h-3zM421 64h3v3h-3zM424 64h3v3h-3zM406 67h3v3h-3zM409 67h3v3h-3zM412 67h3v3h-3zM415 67h3v3h-3zM418 67h3v3h-3zM421 67h3v3h-3zM424 67h3v3h-3zM409 70h3v3h-3zM412 70h3v3h-3zM415 70h3v3h-3zM418 70h3v3h-3zM421 70h3v3h-3zM412 73h3v3h-3zM415 73h3v3h-3zM418 73h3v3h-3z"/></g><text class="mono mute" x="18" y="98" font-size="8.5" letter-spacing=".5">UPDATED 2026-11-21 · TRUEPUSHKAR + NULLSTACKS</text></svg>